<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Juan Velandia">
    <meta name="description" content="Estadisticas de usuario">
    <meta name="application-name" content="EcoMarket">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <title>Widget de usuario</title>
</head>
<body>

    <header class="header">

        <div class="header__contenido">
            <img class="header__avatar" src="../img/icons/cliente-1.svg" alt="" width="120" height="120" loading="lazy">
            <h2 class="avatar__nombre">Laura Goméz</h2>
            <p class="avatar__info">Eco warrior - Member since 2023</p>
        </div>
    </header>

    <main>

        <div class="estadisticas__grid">
            
            <article class="estadistica">
                <img class="estadistica__imagen" src="#" alt="Arbol" width="24" height="24">
                <h3 class="estaditica__nombre">Trees - Replanted</h3>
                <p class="estadistica__numero"><strong>12/20</strong></p>
                <p class="estadistica__barra visualmente-oculto">Barra de la estadistica</p>
            </article>

            <article class="estadistica">
                <img class="estadistica__imagen" src="#" alt="Co" width="24" height="24">
                <h3 class="estaditica__nombre">Co<sub>2</sub> - Saved</h3>
                <p class="estadistica__numero"><strong>450 kg</strong></p>
                <p class="estadistica__barra visualmente-oculto">Barra de la estadistica</p>
            </article>

            <article class="estadistica">
                <img class="estadistica__imagen" src="#" alt="Agua" width="24" height="24">
                <h3 class="estaditica__nombre">Water Saved</h3>
                <p class="estadistica__numero"><strong>2450 L</strong></p>
                <p class="estadistica__barra visualmente-oculto">Barra de la estadistica</p>
            </article>

        </div>

    </main>

    <footer class="footer__2">
        
        <a class="footer__link" href="#">|View Full Impact Report  | ====></a>

    </footer>
    
</body>
</html>
